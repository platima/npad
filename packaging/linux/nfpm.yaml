# nfpm configuration: one description for both the .deb and the .rpm.
# Driven by scripts/build-package.sh, which stages `make install` into
# NPAD_STAGE and exports NPAD_VERSION, NPAD_RELEASE (empty for the .deb, which
# has no packaging revision; 1 for the .rpm) and NPAD_GLIBC. nfpm is a single
# static binary used by CI and by anyone building the rpm; it is not a build
# dependency of npad itself.
name: npad
arch: amd64
platform: linux
version: ${NPAD_VERSION}
release: ${NPAD_RELEASE}
section: editors
priority: optional
maintainer: Platima <13729856+platima@users.noreply.github.com>
homepage: https://npad.dev
license: MIT
description: |-
  Lightweight Notepad-style text editor
  npad is a small, fast text editor inspired by classic Windows Notepad.
  It preserves each file's encoding and line endings and saves atomically.

contents:
  # Files staged by `make install`. Listed one by one rather than as a tree so
  # the rpm does not claim ownership of shared directories such as
  # /usr/share/icons/hicolor (kept in step with LINUX_ICON_SIZES in the
  # Makefile).
  - src: ${NPAD_STAGE}/usr/bin/npad
    dst: /usr/bin/npad
    expand: true
  - src: ${NPAD_STAGE}/usr/share/applications/io.github.platima.npad.desktop
    dst: /usr/share/applications/io.github.platima.npad.desktop
    expand: true
  - src: ${NPAD_STAGE}/usr/share/metainfo/io.github.platima.npad.metainfo.xml
    dst: /usr/share/metainfo/io.github.platima.npad.metainfo.xml
    expand: true
  - src: ${NPAD_STAGE}/usr/share/icons/hicolor/16x16/apps/io.github.platima.npad.png
    dst: /usr/share/icons/hicolor/16x16/apps/io.github.platima.npad.png
    expand: true
  - src: ${NPAD_STAGE}/usr/share/icons/hicolor/24x24/apps/io.github.platima.npad.png
    dst: /usr/share/icons/hicolor/24x24/apps/io.github.platima.npad.png
    expand: true
  - src: ${NPAD_STAGE}/usr/share/icons/hicolor/32x32/apps/io.github.platima.npad.png
    dst: /usr/share/icons/hicolor/32x32/apps/io.github.platima.npad.png
    expand: true
  - src: ${NPAD_STAGE}/usr/share/icons/hicolor/48x48/apps/io.github.platima.npad.png
    dst: /usr/share/icons/hicolor/48x48/apps/io.github.platima.npad.png
    expand: true
  - src: ${NPAD_STAGE}/usr/share/icons/hicolor/64x64/apps/io.github.platima.npad.png
    dst: /usr/share/icons/hicolor/64x64/apps/io.github.platima.npad.png
    expand: true
  - src: ${NPAD_STAGE}/usr/share/icons/hicolor/128x128/apps/io.github.platima.npad.png
    dst: /usr/share/icons/hicolor/128x128/apps/io.github.platima.npad.png
    expand: true
  - src: ${NPAD_STAGE}/usr/share/icons/hicolor/256x256/apps/io.github.platima.npad.png
    dst: /usr/share/icons/hicolor/256x256/apps/io.github.platima.npad.png
    expand: true

# libgtk-3-0t64 is the name since Debian 13 / Ubuntu 24.04 (64-bit time_t
# transition); older releases ship libgtk-3-0. The libc floor is read from the
# binary by the build script. Keep the deb Depends in step with
# scripts/build-deb.sh (the dpkg-deb fallback); CI diffs the two.
overrides:
  deb:
    depends:
      - libc6 (>= ${NPAD_GLIBC})
      - libgtk-3-0t64 (>= 3.24) | libgtk-3-0 (>= 3.24)
  rpm:
    depends:
      - glibc >= ${NPAD_GLIBC}
      - gtk3 >= 3.24
