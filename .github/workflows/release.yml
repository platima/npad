name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

# Creating the release and uploading assets needs write access; the default
# GITHUB_TOKEN is read-only
permissions:
  contents: write
  id-token: write   # Passed through to installers.yml for Azure Trusted Signing

env:
  BUILD_TYPE: Release

jobs:
  # Run the main CI workflow first to ensure quality
  ci-validation:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  create-release:
    runs-on: ubuntu-latest
    needs: ci-validation
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
    - name: Get version from tag
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref }}
        name: npad ${{ steps.get_version.outputs.version }}
        body: |
          ## npad ${{ steps.get_version.outputs.version }}

          🎉 **New Release Available!**

          ### Downloads

          **Windows Builds:**
          - `npad-${{ steps.get_version.outputs.version }}-setup-win-x64.exe` - Windows installer (per-user by default; system-wide available)
          - `npad-${{ steps.get_version.outputs.version }}-msi-win-x64.msi` - Windows MSI for silent/managed deployment (`msiexec /i ... /qn`)
          - `npad-${{ steps.get_version.outputs.version }}-portable-win-x64.exe` - Portable GUI version for Windows (no install needed)

          **Linux (Debian, Ubuntu, Mint):**
          - `npad_<version>_amd64.deb` - GTK 3 desktop app for X11 and Wayland (`sudo apt install ./npad_<version>_amd64.deb`)

          **Verification:**
          - `CHECKSUMS.txt` - SHA256 checksums for all files
          - Verify with: `sha256sum -c CHECKSUMS.txt` (Linux/macOS) or `Get-FileHash` (Windows)

          ### Installation
          1. Download the appropriate file for your system from the Assets below
          2. **Windows**: Run `npad-v*-setup-win-x64.exe` to install (or `msiexec /i npad-v*-msi-win-x64.msi /qn` for silent), or run the portable exe directly
          3. **Verification**: Check the file integrity using the provided checksums

          > **SmartScreen warning?** Check the file's Properties → Digital Signatures tab. A signed release names the publisher there; SmartScreen can still warn while a publisher's reputation is new. Verify the SHA256 against `CHECKSUMS.txt` if unsure, then "More info" → "Run anyway".

          ### Changes
          See the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for detailed changes in this release.

          ---

          **Build Info:**
          - Commit: `${{ github.sha }}`
          - Built: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - [CI Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        draft: false
        prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}
        generate_release_notes: true

  # Every published binary comes from the Windows job in installers.yml: the
  # installers, and the portable exe, which is the very same npad.exe the
  # installers carry. One build, one (optional) signature, one checksum set.
  # ci.yml still cross-compiles the Windows target on Linux, so that path
  # stays tested; it just is not what ships. Linux ships as the .deb from
  # build-deb below; the terminal variants are unimplemented stubs and are not
  # published.
  build-installers:
    needs: create-release
    uses: ./.github/workflows/installers.yml
    with:
      release_tag: ${{ needs.create-release.outputs.version }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write

  # Linux: the .deb for Debian/Ubuntu (apt install ./npad_<v>_amd64.deb).
  # Built on 22.04 rather than ubuntu-latest so the binary's glibc floor (which
  # the package's Depends is computed from) stays low enough for Debian 12.
  build-deb:
    runs-on: ubuntu-22.04
    needs: create-release
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q build-essential pkg-config libgtk-3-dev libncurses-dev

    - name: Build the .deb
      env:
        VERSION: ${{ needs.create-release.outputs.version }}
      run: |
        make clean
        make deb
        deb=$(ls dist/npad_*_amd64.deb)
        # The package version comes from src/main.h; the tag must agree
        if [ "$(basename "$deb")" != "npad_${VERSION#v}_amd64.deb" ]; then
          echo "ERROR: built $(basename "$deb") but the tag is $VERSION (bump src/main.h?)"
          exit 1
        fi
        cd dist && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256"

    - name: Attach to the release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.create-release.outputs.version }}
        files: |
          dist/npad_*_amd64.deb
          dist/npad_*_amd64.deb.sha256

  # Nothing releasable can execute on this runner, so validation asserts the complete expected asset set
  # exists on the release with plausible sizes and matching checksums.
  validate-release:
    runs-on: ubuntu-latest
    needs: [create-release, build-installers, build-deb]
    steps:
    - uses: actions/checkout@v7

    - name: Verify the in-app updater can still find its download
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ needs.create-release.outputs.version }}
      run: |
        # npad resolves its download by matching the END of each release asset
        # name (update_find_asset_url). Read those suffixes straight from the
        # source so this guard cannot drift: renaming release assets without
        # updating the updater - or the reverse - fails HERE, loudly, instead of
        # silently stranding every npad already installed. That has happened
        # once before, in v0.17.x.
        suffixes=$(grep -oP 'update_find_asset_url\(rel, "\K[^"]+' src/platform/ui_win32.c | sort -u)
        if [ -z "$suffixes" ]; then
          echo "ERROR: could not read the updater's asset suffixes from src/platform/ui_win32.c"
          echo "       (did update_find_asset_url move or change shape?)"
          exit 1
        fi
        names=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VERSION" \
          | jq -r '.assets[].name')
        echo "Release assets:"; echo "$names" | sed 's/^/  /'
        echo "Suffixes the in-app updater matches:"; echo "$suffixes" | sed 's/^/  /'
        failed=0
        while IFS= read -r sfx; do
          [ -n "$sfx" ] || continue
          esc=$(printf '%s' "$sfx" | sed 's/[].[^$*\\]/\\&/g')
          if echo "$names" | grep -qiE -- "${esc}\$"; then
            echo "OK: an asset ends with '$sfx'"
          else
            echo "ERROR: no release asset ends with '$sfx'"
            echo "       The in-app updater would not find its download."
            failed=1
          fi
        done <<< "$suffixes"
        exit $failed

    - name: Validate release assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ needs.create-release.outputs.version }}
      run: |
        echo "=== Validating Release Assets for $VERSION ==="
        release_id=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VERSION" \
          | jq -r '.id')
        assets=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/$release_id/assets")

        # Windows assets share one scheme: npad-v<version>-<type>-win-x64.<ext>;
        # the Linux package keeps the Debian name npad_<version>_amd64.deb
        failed=0
        for asset in \
          "npad-$VERSION-setup-win-x64.exe:1000000" \
          "npad-$VERSION-msi-win-x64.msi:500000" \
          "npad-$VERSION-portable-win-x64.exe:100000" \
          "npad_${VERSION#v}_amd64.deb:30000"
        do
          name="${asset%%:*}"
          min_size="${asset##*:}"
          size=$(echo "$assets" | jq -r --arg n "$name" '.[] | select(.name == $n) | .size')
          if [ -z "$size" ]; then
            echo "ERROR: missing asset $name"
            failed=1
          elif [ "$size" -lt "$min_size" ]; then
            echo "ERROR: $name is implausibly small ($size bytes, expected >= $min_size)"
            failed=1
          else
            echo "OK: $name ($size bytes)"
          fi
          # each binary must have its checksum companion
          if ! echo "$assets" | jq -e --arg n "$name.sha256" '.[] | select(.name == $n)' >/dev/null; then
            echo "ERROR: missing checksum $name.sha256"
            failed=1
          fi
        done

        # Spot-check one download against its published checksum
        url=$(echo "$assets" | jq -r --arg n "npad-$VERSION-portable-win-x64.exe" '.[] | select(.name == $n) | .browser_download_url')
        sha_url=$(echo "$assets" | jq -r --arg n "npad-$VERSION-portable-win-x64.exe.sha256" '.[] | select(.name == $n) | .browser_download_url')
        if [ -n "$url" ] && [ -n "$sha_url" ]; then
          curl -L -s "$url" -o portable.exe
          expected=$(curl -L -s "$sha_url" | awk '{print $1}')
          actual=$(sha256sum portable.exe | awk '{print $1}')
          if [ "$expected" = "$actual" ]; then
            echo "OK: portable exe checksum verified ($actual)"
          else
            echo "ERROR: checksum mismatch (expected $expected, got $actual)"
            failed=1
          fi
        fi

        [ "$failed" -eq 0 ] && echo "✓ Release validation completed" || exit 1

  create-checksums:
    runs-on: ubuntu-latest
    needs: [create-release, build-installers, build-deb, validate-release]
    steps:
    - uses: actions/checkout@v7

    - name: Download release assets to create master checksum
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Get all release assets
        release_id=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ needs.create-release.outputs.version }}" \
          | jq -r '.id')

        echo "Release ID: $release_id"

        # Download all .sha256 files
        curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/$release_id/assets" \
          | jq -r '.[] | select(.name | endswith(".sha256")) | .browser_download_url' \
          | while read url; do
            echo "Downloading checksum: $url"
            curl -L -s "$url" >> temp_checksums.txt
          done

    - name: Create master CHECKSUMS.txt
      run: |
        echo "# npad Release Checksums - ${{ needs.create-release.outputs.version }}" > CHECKSUMS.txt
        echo "# Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> CHECKSUMS.txt
        echo "# Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version }}" >> CHECKSUMS.txt
        echo "# Commit: ${{ github.sha }}" >> CHECKSUMS.txt
        echo "" >> CHECKSUMS.txt

        # Add all checksums
        if [ -f temp_checksums.txt ]; then
          cat temp_checksums.txt >> CHECKSUMS.txt
        fi

        echo "" >> CHECKSUMS.txt
        echo "# Verification Instructions:" >> CHECKSUMS.txt
        echo "# Linux/macOS: sha256sum -c CHECKSUMS.txt" >> CHECKSUMS.txt
        echo "# Windows PowerShell: Get-FileHash -Algorithm SHA256 <filename>" >> CHECKSUMS.txt
        echo "# Windows Command Prompt: certutil -hashfile <filename> SHA256" >> CHECKSUMS.txt

        echo "Master checksums file created:"
        cat CHECKSUMS.txt

    - name: Upload master checksums
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.create-release.outputs.version }}
        files: CHECKSUMS.txt

  update-release-notes:
    runs-on: ubuntu-latest
    needs: [create-release, build-installers, build-deb, validate-release, create-checksums]
    steps:
    - name: Update release with final info
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.create-release.outputs.version }}
        body: |
          ## npad ${{ needs.create-release.outputs.version }}

          🎉 **New Release Available!**

          ### Downloads

          **Windows Builds:**
          - `npad-${{ needs.create-release.outputs.version }}-setup-win-x64.exe` - Windows installer (per-user by default; system-wide available)
          - `npad-${{ needs.create-release.outputs.version }}-msi-win-x64.msi` - Windows MSI for silent/managed deployment (`msiexec /i ... /qn`)
          - `npad-${{ needs.create-release.outputs.version }}-portable-win-x64.exe` - Portable GUI version for Windows (no install needed)

          **Linux (Debian, Ubuntu, Mint):**
          - `npad_<version>_amd64.deb` - GTK 3 desktop app for X11 and Wayland (`sudo apt install ./npad_<version>_amd64.deb`)

          **Verification:**
          - `CHECKSUMS.txt` - SHA256 checksums for all files
          - Individual `.sha256` files for each binary
          - Verify with: `sha256sum -c CHECKSUMS.txt` (Linux/macOS) or `Get-FileHash` (Windows)

          ### Installation
          1. Download the appropriate file from the Assets below
          2. **Windows**: Run `npad-v*-setup-win-x64.exe` to install (or `msiexec /i npad-v*-msi-win-x64.msi /qn` for silent), or run the portable exe directly
          3. **Verification**: Check the file integrity using the provided checksums

          > **SmartScreen warning?** Check the file's Properties → Digital Signatures tab. A signed release names the publisher there; SmartScreen can still warn while a publisher's reputation is new. Verify the SHA256 against `CHECKSUMS.txt` if unsure, then "More info" → "Run anyway".

          ### Changes
          See the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for detailed changes in this release.

          ---

          **Build Info:**
          - Commit: `${{ github.sha }}`
          - Built: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - [CI Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - All builds passed CI validation before release
