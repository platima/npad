name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  # Dry run: builds, signs and validates every release asset exactly as a tag
  # would, and publishes nothing - no release, no attachments, no dispatch to
  # npad-packages. Run it before tagging, from the commit you mean to tag:
  #   gh workflow run release.yml --ref main -f version=v0.35.0
  # The assets are left as workflow artifacts to download and try. (GitHub only
  # offers workflow_dispatch for a workflow whose default-branch copy declares
  # it, so this exists once this file is on main.)
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, as its tag would be spelled (e.g. v0.35.0); must match src/main.h"
        type: string
        required: true

# Creating the release and uploading assets needs write access; the default
# GITHUB_TOKEN is read-only
permissions:
  contents: write
  id-token: write   # Passed through to installers.yml for Azure Trusted Signing

env:
  BUILD_TYPE: Release

jobs:
  # Run the main CI workflow first to ensure quality
  ci-validation:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # The version, and whether this run publishes (a tag push) or rehearses (a
  # manual dry run). Every publishing job below is gated on `publish`.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
    - id: v
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = push ]; then
          echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
        else
          case $INPUT_VERSION in
          v[0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "ERROR: version must look like v0.35.0, not '$INPUT_VERSION'"; exit 1 ;;
          esac
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Dry run for $INPUT_VERSION: nothing will be published"
        fi

  create-release:
    runs-on: ubuntu-latest
    needs: [ci-validation, meta]
    if: needs.meta.outputs.publish == 'true'
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
    - name: Get version from tag
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - uses: actions/checkout@v7

    # The notes lead with this version's "### ✨ Highlights" from CHANGELOG.md.
    # Generated before the release exists, so a missing entry or highlights
    # section stops the run while nothing is published yet.
    - name: Write the release notes
      run: |
        sh scripts/release-notes.sh "${{ steps.get_version.outputs.version }}" \
          "${{ github.repository }}" "${{ github.sha }}" \
          "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          > release-notes.md
        cat release-notes.md

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref }}
        name: npad ${{ steps.get_version.outputs.version }}
        body_path: release-notes.md
        draft: false
        prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}

  # Every published binary comes from the Windows job in installers.yml: the
  # installers, and the portable exe, which is the very same npad.exe the
  # installers carry - for x64 and for arm64. One build per architecture, one
  # (optional) signature, one checksum set. ci.yml still cross-compiles both
  # Windows targets on Linux, so that path stays tested; it just is not what
  # ships. Linux ships as the .deb, .rpm and portable tarball from
  # build-packages below; the
  # terminal variants are unimplemented stubs and are not published.
  # In a dry run release_tag is empty, so the deliverables stay artifacts.
  build-installers:
    needs: [ci-validation, meta, create-release]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/installers.yml
    with:
      release_tag: ${{ needs.meta.outputs.publish == 'true' && needs.meta.outputs.version || '' }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write

  # Linux: the .deb (Debian, Ubuntu, Mint) and .rpm (Fedora, openSUSE) for
  # amd64, arm64 and riscv64, compiled in Debian containers and packaged with
  # nfpm, plus the portable npad-v<version>-linux-<arch>.tar.gz of the same
  # binary, then install-tested on each distro by packages.yml. The artifact
  # names differ from the ones CI's own call uses: names must be unique within
  # a run, and ci-validation above builds the packages too.
  build-packages:
    needs: [ci-validation, meta]
    uses: ./.github/workflows/packages.yml
    with:
      release_tag: ${{ needs.meta.outputs.version }}
      artifact_name: npad-linux-packages-release

  attach-packages:
    runs-on: ubuntu-latest
    needs: [meta, create-release, build-packages]
    if: needs.meta.outputs.publish == 'true'
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: npad-linux-packages-release-*
        merge-multiple: true
        path: pkgs

    - name: Attach to the release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.create-release.outputs.version }}
        files: |
          pkgs/npad_*.deb
          pkgs/npad-*.rpm
          pkgs/npad-v*-linux-*.tar.gz
          pkgs/*.sha256

  # Nothing releasable can execute on this runner, so validation asserts the
  # complete expected asset set is there, with plausible sizes, checksums that
  # verify, the right architecture in each portable exe, .deb and Linux
  # tarball, and every
  # installer the in-app updater can ask for (scripts/validate-release-assets.sh).
  # A release checks what was actually published; a dry run checks the
  # artifacts that would have been.
  validate-release:
    runs-on: ubuntu-latest
    needs: [meta, build-installers, build-packages, attach-packages]
    if: ${{ !cancelled() && !failure() }}
    steps:
    - uses: actions/checkout@v7

    - name: Download the published release
      if: needs.meta.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release download "${{ needs.meta.outputs.version }}" --repo "${{ github.repository }}" --dir assets

    - name: Download the dry run's Windows deliverables
      if: needs.meta.outputs.publish != 'true'
      uses: actions/download-artifact@v8
      with:
        name: npad-installers
        path: assets

    - name: Download the dry run's Linux packages
      if: needs.meta.outputs.publish != 'true'
      uses: actions/download-artifact@v8
      with:
        pattern: npad-linux-packages-release-*
        merge-multiple: true
        path: assets

    - name: Validate release assets
      run: |
        ls -la assets
        sh scripts/validate-release-assets.sh assets "${{ needs.meta.outputs.version }}"

  create-checksums:
    runs-on: ubuntu-latest
    needs: [create-release, build-installers, attach-packages, validate-release]
    if: ${{ !cancelled() && !failure() && needs.create-release.result == 'success' }}
    steps:
    - uses: actions/checkout@v7

    - name: Download release assets to create master checksum
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Get all release assets
        release_id=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ needs.create-release.outputs.version }}" \
          | jq -r '.id')

        echo "Release ID: $release_id"

        # Download all .sha256 files
        curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/$release_id/assets" \
          | jq -r '.[] | select(.name | endswith(".sha256")) | .browser_download_url' \
          | while read url; do
            echo "Downloading checksum: $url"
            curl -L -s "$url" >> temp_checksums.txt
          done

    - name: Create master CHECKSUMS.txt
      run: |
        echo "# npad Release Checksums - ${{ needs.create-release.outputs.version }}" > CHECKSUMS.txt
        echo "# Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> CHECKSUMS.txt
        echo "# Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version }}" >> CHECKSUMS.txt
        echo "# Commit: ${{ github.sha }}" >> CHECKSUMS.txt
        echo "" >> CHECKSUMS.txt

        # Add all checksums
        if [ -f temp_checksums.txt ]; then
          cat temp_checksums.txt >> CHECKSUMS.txt
        fi

        echo "" >> CHECKSUMS.txt
        echo "# Verification Instructions:" >> CHECKSUMS.txt
        echo "# Linux/macOS: sha256sum -c CHECKSUMS.txt" >> CHECKSUMS.txt
        echo "# Windows PowerShell: Get-FileHash -Algorithm SHA256 <filename>" >> CHECKSUMS.txt
        echo "# Windows Command Prompt: certutil -hashfile <filename> SHA256" >> CHECKSUMS.txt

        echo "Master checksums file created:"
        cat CHECKSUMS.txt

    - name: Upload master checksums
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.create-release.outputs.version }}
        files: CHECKSUMS.txt

  update-release-notes:
    runs-on: ubuntu-latest
    needs: [create-release, build-installers, attach-packages, validate-release, create-checksums]
    if: ${{ !cancelled() && !failure() && needs.create-release.result == 'success' }}
    steps:
    - uses: actions/checkout@v7

    - name: Write the release notes
      run: |
        sh scripts/release-notes.sh "${{ needs.create-release.outputs.version }}" \
          "${{ github.repository }}" "${{ github.sha }}" \
          "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          > release-notes.md

    - name: Update release with final info
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.create-release.outputs.version }}
        body_path: release-notes.md

  # Tell npad-packages a release is ready so it rebuilds the signed apt/dnf
  # repositories at pkg.npad.dev. Runs last, once every asset is attached and
  # validated (a release is published before its assets are, so earlier would
  # race the uploads). Pre-releases and dry runs are not published to the
  # repositories. npad-packages also rebuilds daily and on demand, so a missed
  # dispatch only delays the update. Needs the NPAD_PACKAGES_TOKEN secret: a
  # fine-grained personal access token limited to platima/npad-packages with
  # "Contents: Read and write" (what the dispatches API requires) and
  # "Metadata: Read-only". Without it this job warns and exits cleanly.
  notify-packages:
    runs-on: ubuntu-latest
    needs: [meta, create-release, validate-release, create-checksums, update-release-notes]
    if: ${{ !cancelled() && !failure() && needs.meta.outputs.publish == 'true' && !contains(needs.meta.outputs.version, '-') }}
    steps:
    - name: Dispatch to npad-packages
      env:
        TOKEN: ${{ secrets.NPAD_PACKAGES_TOKEN }}
        VERSION: ${{ needs.create-release.outputs.version }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "::warning::NPAD_PACKAGES_TOKEN is not set; pkg.npad.dev updates at its next daily rebuild"
          exit 0
        fi
        status=$(curl -s -o response.txt -w '%{http_code}' -X POST \
          -H "Authorization: Bearer $TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/platima/npad-packages/dispatches \
          -d "{\"event_type\":\"npad-release\",\"client_payload\":{\"tag\":\"$VERSION\"}}")
        if [ "$status" = "204" ]; then
          echo "Dispatched $VERSION to platima/npad-packages"
        else
          echo "::warning::dispatch to npad-packages returned HTTP $status; it will pick the release up at its next daily rebuild"
          cat response.txt
        fi
