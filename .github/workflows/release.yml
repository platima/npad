name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

# Creating the release and uploading assets needs write access; the default
# GITHUB_TOKEN is read-only
permissions:
  contents: write
  id-token: write   # Passed through to installers.yml for Azure Trusted Signing

env:
  BUILD_TYPE: Release

jobs:
  # Run the main CI workflow first to ensure quality
  ci-validation:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  create-release:
    runs-on: ubuntu-latest
    needs: ci-validation
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
    - name: Get version from tag
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - uses: actions/checkout@v7

    # The notes lead with this version's "### ✨ Highlights" from CHANGELOG.md.
    # Generated before the release exists, so a missing entry or highlights
    # section stops the run while nothing is published yet.
    - name: Write the release notes
      run: |
        sh scripts/release-notes.sh "${{ steps.get_version.outputs.version }}" \
          "${{ github.repository }}" "${{ github.sha }}" \
          "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          > release-notes.md
        cat release-notes.md

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref }}
        name: npad ${{ steps.get_version.outputs.version }}
        body_path: release-notes.md
        draft: false
        prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}

  # Every published binary comes from the Windows job in installers.yml: the
  # installers, and the portable exe, which is the very same npad.exe the
  # installers carry. One build, one (optional) signature, one checksum set.
  # ci.yml still cross-compiles the Windows target on Linux, so that path
  # stays tested; it just is not what ships. Linux ships as the .deb and .rpm
  # from build-packages below; the terminal variants are unimplemented stubs and are not
  # published.
  build-installers:
    needs: create-release
    uses: ./.github/workflows/installers.yml
    with:
      release_tag: ${{ needs.create-release.outputs.version }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write

  # Linux: the .deb (Debian, Ubuntu, Mint) and .rpm (Fedora), built with nfpm
  # in a Debian 12 container and install-tested on each distro by packages.yml.
  # The artifact name differs from the one CI's own call uses: names must be
  # unique within a run, and ci-validation above builds the packages too.
  build-packages:
    needs: create-release
    uses: ./.github/workflows/packages.yml
    with:
      release_tag: ${{ needs.create-release.outputs.version }}
      artifact_name: npad-linux-packages-release

  attach-packages:
    runs-on: ubuntu-latest
    needs: [create-release, build-packages]
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: npad-linux-packages-release
        path: pkgs

    - name: Attach to the release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.create-release.outputs.version }}
        files: |
          pkgs/npad_*_amd64.deb
          pkgs/npad-*.x86_64.rpm
          pkgs/*.sha256

  # Nothing releasable can execute on this runner, so validation asserts the complete expected asset set
  # exists on the release with plausible sizes and matching checksums.
  validate-release:
    runs-on: ubuntu-latest
    needs: [create-release, build-installers, attach-packages]
    steps:
    - uses: actions/checkout@v7

    - name: Verify the in-app updater can still find its download
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ needs.create-release.outputs.version }}
      run: |
        # npad resolves its download by matching the END of each release asset
        # name (update_find_asset_url). Read those suffixes straight from the
        # source so this guard cannot drift: renaming release assets without
        # updating the updater - or the reverse - fails HERE, loudly, instead of
        # silently stranding every npad already installed. That has happened
        # once before, in v0.17.x.
        suffixes=$(grep -oP 'update_find_asset_url\(rel, "\K[^"]+' src/platform/ui_win32.c | sort -u)
        if [ -z "$suffixes" ]; then
          echo "ERROR: could not read the updater's asset suffixes from src/platform/ui_win32.c"
          echo "       (did update_find_asset_url move or change shape?)"
          exit 1
        fi
        names=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VERSION" \
          | jq -r '.assets[].name')
        echo "Release assets:"; echo "$names" | sed 's/^/  /'
        echo "Suffixes the in-app updater matches:"; echo "$suffixes" | sed 's/^/  /'
        failed=0
        while IFS= read -r sfx; do
          [ -n "$sfx" ] || continue
          esc=$(printf '%s' "$sfx" | sed 's/[].[^$*\\]/\\&/g')
          if echo "$names" | grep -qiE -- "${esc}\$"; then
            echo "OK: an asset ends with '$sfx'"
          else
            echo "ERROR: no release asset ends with '$sfx'"
            echo "       The in-app updater would not find its download."
            failed=1
          fi
        done <<< "$suffixes"
        exit $failed

    - name: Validate release assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ needs.create-release.outputs.version }}
      run: |
        echo "=== Validating Release Assets for $VERSION ==="
        release_id=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VERSION" \
          | jq -r '.id')
        assets=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/$release_id/assets")

        # Windows assets share one scheme: npad-v<version>-<type>-win-x64.<ext>;
        # the Linux packages keep their native names: npad_<version>_amd64.deb
        # and npad-<version>-1.x86_64.rpm
        failed=0
        for asset in \
          "npad-$VERSION-setup-win-x64.exe:1000000" \
          "npad-$VERSION-msi-win-x64.msi:500000" \
          "npad-$VERSION-portable-win-x64.exe:100000" \
          "npad_${VERSION#v}_amd64.deb:30000" \
          "npad-${VERSION#v}-1.x86_64.rpm:30000"
        do
          name="${asset%%:*}"
          min_size="${asset##*:}"
          size=$(echo "$assets" | jq -r --arg n "$name" '.[] | select(.name == $n) | .size')
          if [ -z "$size" ]; then
            echo "ERROR: missing asset $name"
            failed=1
          elif [ "$size" -lt "$min_size" ]; then
            echo "ERROR: $name is implausibly small ($size bytes, expected >= $min_size)"
            failed=1
          else
            echo "OK: $name ($size bytes)"
          fi
          # each binary must have its checksum companion
          if ! echo "$assets" | jq -e --arg n "$name.sha256" '.[] | select(.name == $n)' >/dev/null; then
            echo "ERROR: missing checksum $name.sha256"
            failed=1
          fi
        done

        # Spot-check one download against its published checksum
        url=$(echo "$assets" | jq -r --arg n "npad-$VERSION-portable-win-x64.exe" '.[] | select(.name == $n) | .browser_download_url')
        sha_url=$(echo "$assets" | jq -r --arg n "npad-$VERSION-portable-win-x64.exe.sha256" '.[] | select(.name == $n) | .browser_download_url')
        if [ -n "$url" ] && [ -n "$sha_url" ]; then
          curl -L -s "$url" -o portable.exe
          expected=$(curl -L -s "$sha_url" | awk '{print $1}')
          actual=$(sha256sum portable.exe | awk '{print $1}')
          if [ "$expected" = "$actual" ]; then
            echo "OK: portable exe checksum verified ($actual)"
          else
            echo "ERROR: checksum mismatch (expected $expected, got $actual)"
            failed=1
          fi
        fi

        [ "$failed" -eq 0 ] && echo "✓ Release validation completed" || exit 1

  create-checksums:
    runs-on: ubuntu-latest
    needs: [create-release, build-installers, attach-packages, validate-release]
    steps:
    - uses: actions/checkout@v7

    - name: Download release assets to create master checksum
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Get all release assets
        release_id=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ needs.create-release.outputs.version }}" \
          | jq -r '.id')

        echo "Release ID: $release_id"

        # Download all .sha256 files
        curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/$release_id/assets" \
          | jq -r '.[] | select(.name | endswith(".sha256")) | .browser_download_url' \
          | while read url; do
            echo "Downloading checksum: $url"
            curl -L -s "$url" >> temp_checksums.txt
          done

    - name: Create master CHECKSUMS.txt
      run: |
        echo "# npad Release Checksums - ${{ needs.create-release.outputs.version }}" > CHECKSUMS.txt
        echo "# Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> CHECKSUMS.txt
        echo "# Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version }}" >> CHECKSUMS.txt
        echo "# Commit: ${{ github.sha }}" >> CHECKSUMS.txt
        echo "" >> CHECKSUMS.txt

        # Add all checksums
        if [ -f temp_checksums.txt ]; then
          cat temp_checksums.txt >> CHECKSUMS.txt
        fi

        echo "" >> CHECKSUMS.txt
        echo "# Verification Instructions:" >> CHECKSUMS.txt
        echo "# Linux/macOS: sha256sum -c CHECKSUMS.txt" >> CHECKSUMS.txt
        echo "# Windows PowerShell: Get-FileHash -Algorithm SHA256 <filename>" >> CHECKSUMS.txt
        echo "# Windows Command Prompt: certutil -hashfile <filename> SHA256" >> CHECKSUMS.txt

        echo "Master checksums file created:"
        cat CHECKSUMS.txt

    - name: Upload master checksums
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.create-release.outputs.version }}
        files: CHECKSUMS.txt

  update-release-notes:
    runs-on: ubuntu-latest
    needs: [create-release, build-installers, attach-packages, validate-release, create-checksums]
    steps:
    - uses: actions/checkout@v7

    - name: Write the release notes
      run: |
        sh scripts/release-notes.sh "${{ needs.create-release.outputs.version }}" \
          "${{ github.repository }}" "${{ github.sha }}" \
          "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          > release-notes.md

    - name: Update release with final info
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.create-release.outputs.version }}
        body_path: release-notes.md

  # Tell npad-packages a release is ready so it rebuilds the signed apt/dnf
  # repositories at pkg.npad.dev. Runs last, once every asset is attached and
  # validated (a release is published before its assets are, so earlier would
  # race the uploads). Pre-releases are not published to the repositories.
  # npad-packages also rebuilds daily and on demand, so a missed dispatch only
  # delays the update. Needs the NPAD_PACKAGES_TOKEN secret: a fine-grained
  # personal access token limited to platima/npad-packages with
  # "Contents: Read and write" (what the dispatches API requires) and
  # "Metadata: Read-only". Without it this job warns and exits cleanly.
  notify-packages:
    runs-on: ubuntu-latest
    needs: [create-release, validate-release, create-checksums, update-release-notes]
    if: ${{ !contains(needs.create-release.outputs.version, '-') }}
    steps:
    - name: Dispatch to npad-packages
      env:
        TOKEN: ${{ secrets.NPAD_PACKAGES_TOKEN }}
        VERSION: ${{ needs.create-release.outputs.version }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "::warning::NPAD_PACKAGES_TOKEN is not set; pkg.npad.dev updates at its next daily rebuild"
          exit 0
        fi
        status=$(curl -s -o response.txt -w '%{http_code}' -X POST \
          -H "Authorization: Bearer $TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/platima/npad-packages/dispatches \
          -d "{\"event_type\":\"npad-release\",\"client_payload\":{\"tag\":\"$VERSION\"}}")
        if [ "$status" = "204" ]; then
          echo "Dispatched $VERSION to platima/npad-packages"
        else
          echo "::warning::dispatch to npad-packages returned HTTP $status; it will pick the release up at its next daily rebuild"
          cat response.txt
        fi
